<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- First Time Boot Screen -->
  <div id="boot-screen" class="screen boot-screen">
    <h1>Welcome!</h1>
    <p>Customize your experience</p>

    <!-- Photo Upload for Lock Screen -->
    <div class="photo-upload">
      <label for="lock-photo">Upload Lock Screen Photo:</label>
      <input type="file" id="lock-photo" accept="image/*">
    </div>

    <!-- Photo Upload for Home Screen -->
    <div class="photo-upload">
      <label for="home-photo">Upload Home Screen Photo:</label>
      <input type="file" id="home-photo" accept="image/*">
    </div>

    <!-- Set Password -->
    <div class="password-setup">
      <label for="password">Set Password:</label>
      <input type="password" id="password" placeholder="Enter a password">
    </div>

    <button id="submit-preferences">Finish Setup</button>
  </div>

  <!-- Dynamic Island -->
  <div class="dynamic-island" id="dynamic-island">
    <div id="dynamic-content">No notifications</div>
  </div>

  <!-- Lock Screen -->
  <div id="lock-screen" class="screen lock-screen">
    <div class="time" id="time"></div>
    <div class="date" id="date"></div>

    <!-- Password Unlock -->
    <div class="unlock-container">
      <input type="password" id="unlock-password" placeholder="Enter password to unlock">
      <button id="unlock-button">Unlock</button>
    </div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen" class="screen home-screen">
    <div class="apps">
      <div class="app-icon">
        <img src="phone.png" alt="Phone">
        <p>Phone</p>
      </div>
      <div class="app-icon">
        <img src="messages.png" alt="Messages">
        <p>Messages</p>
      </div>
      <div class="app-icon">
        <img src="camera.png" alt="Camera">
        <p>Camera</p>
      </div>
      <!-- More app icons... -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
