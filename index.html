<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dynamic Island -->
  <div class="dynamic-island">
    <div class="dynamic-content">
      <p>Music Playing...</p>
    </div>
  </div>

  <!-- Lock Screen -->
  <div id="lock-screen" class="screen lock-screen">
    <div class="time">12:45</div>
    <div class="date">Friday, October 12</div>
    <div class="unlock">Swipe up to unlock</div>
  </div>

  <!-- Home Screen -->
  <div id="home-screen" class="screen home-screen">
    <div class="apps">
      <div class="app-icon">
        <img src="phone.png" alt="Phone">
        <p>Phone</p>
      </div>
      <div class="app-icon">
        <img src="messages.png" alt="Messages">
        <p>Messages</p>
      </div>
      <div class="app-icon">
        <img src="camera.png" alt="Camera">
        <p>Camera</p>
      </div>
      <div class="app-icon">
        <img src="settings.png" alt="Settings">
        <p>Settings</p>
      </div>
      <!-- Add more app icons as needed -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
